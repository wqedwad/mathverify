[project]
name = "mathverify"
version = "0.1.0"
description = "Three-valued deterministic verifier for AI-generated math solutions (TYT/AYT/UNI). Phase 1: no LLM layers."
requires-python = ">=3.12"
dependencies = [
  "sympy==1.14.0",
  "mpmath==1.3.0",
  "z3-solver==5.1.0.0",
  "math-verify==0.9.0",
  "latex2sympy2-extended==1.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-timeout", "hypothesis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
