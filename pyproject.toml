[project]
name = "mathverify"
version = "0.1.0"
description = "Three-valued verifier for AI-generated math solutions (TYT/AYT/UNI): deterministic certificates, a step refuter, cross-family LLM signals and a Lean 4 formal layer."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "wqedwad" }]
keywords = ["mathematics", "verification", "llm-evaluation", "lean4", "sympy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.12"
dependencies = [
  "sympy==1.14.0",
  "mpmath==1.3.0",
  "z3-solver==5.1.0.0",
  "math-verify==0.9.0",
  "latex2sympy2-extended==1.11.0",
]

[project.optional-dependencies]
# The F3+ layers. Pinned like everything else: `anthropic` drives a beta API surface
# (beta.messages.stream, output_config, thinking=adaptive, server-side-fallback betas), so an
# unpinned upgrade can break the LLM layers with no test able to catch it offline.
llm = ["anthropic==1.7.0", "python-dotenv==1.2.3"]
# pyflakes backs the "pyflakes temiz" gate in scripts/check.py (undefined names in rarely-run
# branches are the bugs it exists for) and scripts/dev/clean_imports.py.
dev = ["pytest>=9", "pytest-timeout", "hypothesis", "pyflakes>=3"]

[project.urls]
Repository = "https://github.com/wqedwad/mathverify"
Issues = "https://github.com/wqedwad/mathverify/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
